<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>GIF Mart - Lets go shopping!</title>
	<link rel="stylesheet" href="style.css">
	
</head>
<body>

	<header class="header">
	  <h1>GIF Mart</h1>

	  <form class="search" role="search" onsubmit="Searchbar(event)">
	    <!-- <label class="visually-hidden" for="gif-search">Search GIFs</label> -->
	    <input id="gif-search" name="q" type="search" placeholder="Search GIFs">
	    <button type="submit">Search</button>
	  </form>
	</header>

	<div id="window">
	  <div class="card">
	    <img src="https://c.tenor.com/Pd9ZjHO2vkYAAAAd/tenor.gif">
	  </div>
	  <div class="card">
	    <img src="https://c.tenor.com/AsO2siHj2t0AAAAC/tenor.gif">
	  </div>
	</div>
	



	<script src="env"></script>
	<script>
		async function Searchbar(event) {
			event.preventDefault();
			var request = document.querySelector("#gif-search").value.trim();
			await Search(request);
		}

		async function Search(src) {
			// alert(src);
			ClearAllGifs();

			var urls = await Query(src);
			for(let i = 0; i < urls.length; i++) {
				CreateGif(urls[i]);
			}
		}

		async function Query(src) {
			const params = new URLSearchParams({
				api_key: GIPHY_API_KEY,
				q: src,
				limit: "30",
				rating: "g",
			});

			const apiUrl = `https://api.giphy.com/v1/gifs/search?${params}`;
			const response = await fetch(apiUrl);
			var json = await response.json();

			return json.data.map(gif => gif.images.original.url);
			// return [];
		}

		function CreateGif(src) {
			const card = document.createElement("div");
			card.className = "card";

			const gif = document.createElement("img");
			gif.src = src;

			card.appendChild(gif);
			document.getElementById("window").appendChild(card);
		}
		function ClearAllGifs() {
			const myNode = document.getElementById("window");
			while(myNode.firstChild) {
				myNode.removeChild(myNode.lastChild);
			}
		}





	</script>


</body>
</html>
